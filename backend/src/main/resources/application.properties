# Application Name
spring.application.name=foodiehub

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration (use Docker Compose env vars)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:foodiehub}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 Console in Docker
spring.h2.console.enabled=false

# Actuator endpoints for Docker health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.foodiehub=INFO
logging.level.org.springframework.web=INFO