apiVersion: v1
kind: PersistentVolumeClaim
metadata:
 name: postgres-pvc
 namespace: foodiehub
spec:
 accessModes:
  - ReadWriteOnce
 resources:
 requests:
 storage: 1Gi
 ---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: postgres
 namespace: foodiehub
spec:
 replicas: 1
 selector:
  matchLabels:
   app: postgres
 template:
  metadata:
   labels:
    app: postgres
  spec:
   containers:
   - name: postgres
     image: postgres:15-alpine
     ports:
     - containerPort: 5432
     env:
     - name: POSTGRES_DB
       value: "foodiehub"
     - name: POSTGRES_USER
       value: "postgres"
     - name: POSTGRES_PASSWORD
       value: "postgres"
     - name: PGDATA
       value: /var/lib/postgresql/data/pgdata
     volumeMounts:
      - name: postgres-storage
        mountPath: /var/lib/postgresql/data
     livenessProbe:
        exec:
          command:
          - pg_isready
          - -U
          - postgres
        initialDelaySeconds: 30
        periodSeconds: 10
     readinessProbe:
       exec:
        command:
        - pg_isready
        - -U
        - postgres
       initialDelaySeconds: 5
       periodSeconds: 5
     volumes:
     - name: postgres-storage
       persistentVolumeClaim:
         claimName: postgres-pvc