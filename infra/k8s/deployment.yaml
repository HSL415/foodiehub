apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodiehub-backend
  namespace: foodiehub
  labels:
    app: foodiehub-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foodiehub-backend
  template:
    metadata:
      labels:
        app: foodiehub-backend
    spec:
      containers:
      - name: foodiehub-backend
        image: foodiehub/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: foodiehub-config
              key: SPRING_PROFILES_ACTIVE
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: foodiehub-config
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: foodiehub-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: foodiehub-config
              key: DB_USER
        - name: DB_PASSWORD
          value: "postgres"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5