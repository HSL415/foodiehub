<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - FoodieHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container cart-container">
    <h2>Your Cart <span>🛒</span></h2>
    <div id="cart-items"></div>
    <div class="cart-summary">
      <p><strong>Total Price:</strong> ₹<span id="total-price">0</span></p>
    </div>
    <div class="cart-actions">
      <button class="clear-button" onclick="clearCart()">🧹 Clear Cart</button>
      <a href="index.html" class="back-button">← Back to Home</a>
    </div>
    <!-- Decorative area for visuals -->
    <div class="cart-fun">
      <img src="images/banner.jpg" alt="Cart banner" style="width:140px;border-radius:10px;margin-top:25px;">
      <div class="cart-mood">Enjoy your feast! 🍽️</div>
    </div>
  </div>
  <script>
    // Example: A lookup for item names to images
     const imageMap = {
  // Veg Dishes
  "Paneer Tikka": "images/veg1.jpg",
  "Masala Dosa": "images/veg4.jpg",
  "Chole Bhature": "images/veg5.jpg",
  "Veg Biryani": "images/veg6.jpg",
  "Palak Paneer": "images/veg7.jpg",
  "Dal Tadka": "images/veg8.jpg",
  "Stuffed Paratha": "images/veg9.jpg",
  "Plain Rice": "images/plainrice.jpg",

  // Non-Veg Dishes
  "Chicken Curry": "images/nonveg1.jpg",
  "Grilled Fish": "images/nonveg2.jpg",
  "Chicken Biryani": "images/nonveg3.jpg",
  "Mutton Rogan Josh": "images/nonveg4.jpg",
  "Egg Curry": "images/nonveg5.jpg",
  "Butter Chicken": "images/nonveg6.jpg",
  "Fish Fry": "images/nonveg7.jpg",
  "Chicken Tikka": "images/nonveg8.jpg",
  "Prawn Masala": "images/nonveg9.jpg",
  "Chicken Lollipop": "images/nonveg10.jpg",

  // Fruits & Juices
  "Fruit Salad": "images/fruit1.jpg",
  "Mango Juice": "images/fruit2.jpg",
  "Watermelon Juice": "images/fruit3.jpg",
  "Pineapple Juice": "images/fruit4.jpg",
  "Apple Shake": "images/fruit5.jpg",
  "Banana Smoothie": "images/fruit6.jpg",
  "Orange Juice": "images/fruit7.jpg",
  "Strawberry Shake": "images/fruit8.jpg",
  "Papaya Bowl": "images/fruit9.jpg",
  "Grape Juice": "images/fruit10.jpg"
};

    function loadCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const cartContainer = document.getElementById("cart-items");
      const totalPriceElement = document.getElementById("total-price");

      if (cart.length === 0) {
        cartContainer.innerHTML = "<p>Your cart is empty.</p>";
        totalPriceElement.textContent = "0";
      } else {
        cartContainer.innerHTML = "";
        let total = 0;
        cart.forEach((item, index) => {
          total += item.price;
          const imgFile = imageMap[item.item] ? imageMap[item.item] : "logo.png";
          const div = document.createElement("div");
          div.className = "cart-item";
          div.innerHTML = `
            <img src="${imgFile}" alt="${item.item}" class="cart-thumb"/>
            <strong>${item.item}</strong> - ₹${item.price}
            <button class="remove-button" onclick="removeItem(${index})">Remove</button>
          `;
          cartContainer.appendChild(div);
        });
        totalPriceElement.textContent = total;
      }
    }
    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
    }
    function clearCart() {
      localStorage.removeItem("cart");
      loadCart();
      alert("Cart has been cleared.");
    }
    window.onload = loadCart;
  </script>
</body>
</html>
